[pytest]
testpaths = tests
# Tests import `app.*`, so the backend root has to be on sys.path. Setting it
# here rather than relying on rootdir inference keeps `pytest` working from any
# directory.
pythonpath = .
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Third-party deprecations we don't control; our own code should stay clean.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:anyio.*
